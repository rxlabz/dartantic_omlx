name: dartantic_omlx
description: A dartantic_ai provider for oMLX, the OpenAI-compatible LLM inference server
  for Apple Silicon. Supports streaming chat, reasoning, tool calling, typed
  output, embeddings, text-to-speech, reranking and model management.
version: 0.1.0
# repository: https://github.com/my_org/my_repo
publish_to: none
environment:
  sdk: ^3.13.0

dependencies:
  dartantic_ai: ^3.4.2
  dartantic_interface: ^4.0.1
  domlx:
    path: /Users/rx/dev/labz/locallm/locallm/domlx
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.18.0
  uuid: ^4.5.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
